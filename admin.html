<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10070d"><title>♡</title><style>@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Playfair+Display:wght@500;600&display=swap");*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#4b1027,#10070d 65%);color:#fff2ed;font-family:"DM Sans",sans-serif;padding:22px}.wrap{max-width:760px;margin:8vh auto;background:#1a0b13;border:1px solid #704055;border-radius:20px;padding:clamp(22px,5vw,38px);box-shadow:0 20px 70px #0008}h1{font:34px "Playfair Display",serif;color:#ffc2d0;margin:0 0 22px}.entry{display:flex;gap:10px;flex-wrap:wrap}.entry input{flex:1;min-width:180px;background:#10070d;color:#fff;border:1px solid #704055;border-radius:10px;padding:13px;font:inherit}.entry button{background:#a71843;color:#fff;border:1px solid #ff7d9a;border-radius:10px;padding:12px 18px;font:inherit}.list{display:grid;gap:10px;margin-top:20px}.item{background:#10070d;border:1px solid #603047;border-radius:12px;padding:15px;line-height:1.7}.item time{display:block;color:#b897a5;font-size:12px;margin-top:6px}.note{color:#ffc2d0;font-size:13px;margin-top:15px}</style></head><body><main class="wrap"><h1>♡</h1><form class="entry" id="gate"><input id="code" type="password" autocomplete="off" aria-label="Access" required><button>Open</button></form><div class="note" id="note"></div><div class="list" id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://bhtyestavehwaymfozxw.supabase.co","sb_publishable_VpUhQZY8bczeIYv-oo8mLQ_YHPTjm7r");const labels={yes:"I’d like that ♡",time:"I need time 🌙",friend:"I see you as a friend"};document.getElementById("gate").addEventListener("submit",async e=>{e.preventDefault();const note=document.getElementById("note"),list=document.getElementById("list");if(document.getElementById("code").value.trim().toLowerCase()!=="kamil"){note.textContent="";return}note.textContent="";list.textContent="Loading…";const r=await db.from("noor_responses").select("id,answer,created_at").order("created_at",{ascending:false}).limit(500);if(r.error){list.textContent="Could not load responses right now.";return}list.textContent="";if(!r.data||!r.data.length){list.textContent="Abhi koi response nahi aaya. ♡";return}for(const item of r.data){const row=document.createElement("article");row.className="item";const label=document.createElement("div");label.textContent=labels[item.answer]||item.answer;const time=document.createElement("time");time.textContent=new Date(item.created_at).toLocaleString("en-PK",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Karachi"});row.append(label,time);list.append(row)}});</script></body></html>
